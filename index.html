<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="My Calendar" />
  <title>My Calendar</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: #000; }
    body { font-family: 'Inter', system-ui, sans-serif; overscroll-behavior: none; }
    button, input, textarea, select { font-family: inherit; }
    ::-webkit-scrollbar { display: none; }
    input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

    const THEMES = {
      0:  { name:"City",    emoji:"🏙", seed:1083, accent:"#e94560" },
      1:  { name:"Nature",  emoji:"🌿", seed:1036, accent:"#52b788" },
      2:  { name:"Space",   emoji:"🚀", seed:1041, accent:"#90e0ef" },
      3:  { name:"Animal",  emoji:"🦁", seed:582,  accent:"#ffd166" },
      4:  { name:"Car",     emoji:"🏎", seed:111,  accent:"#ff6b6b" },
      5:  { name:"Ocean",   emoji:"🌊", seed:1057, accent:"#48cae4" },
      6:  { name:"Desert",  emoji:"🏜", seed:1059, accent:"#e9c46a" },
      7:  { name:"Forest",  emoji:"🌲", seed:15,   accent:"#a7c957" },
      8:  { name:"Volcano", emoji:"🌋", seed:1071, accent:"#f48c06" },
      9:  { name:"Arctic",  emoji:"🧊", seed:1065, accent:"#90caf9" },
      10: { name:"Sakura",  emoji:"🌸", seed:1060, accent:"#f48fb1" },
      11: { name:"Galaxy",  emoji:"✨", seed:1024, accent:"#e0aaff" },
    };

    const EMPTY_FORM = { place:"", person:"", time:"", title:"" };

    function toKey(y,m,d){ return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }
    function todayKey(){ const d=new Date(); return toKey(d.getFullYear(),d.getMonth(),d.getDate()); }

    function App() {
      const [now] = useState(new Date());
      const [viewYear, setViewYear] = useState(now.getFullYear());
      const [viewMonth, setViewMonth] = useState(now.getMonth());
      const [selectedDate, setSelectedDate] = useState(null);
      const [tasks, setTasks] = useState(()=>{ try{ const s=localStorage.getItem("cal_v5"); return s?JSON.parse(s):{}; }catch{ return {}; } });
      const [sheetMode, setSheetMode] = useState(null);
      const [form, setForm] = useState(EMPTY_FORM);
      const [editIdx, setEditIdx] = useState(null);
      const [history, setHistory] = useState(()=>{ try{ const s=localStorage.getItem("cal_hist5"); return s?JSON.parse(s):{places:[],persons:[]}; }catch{ return {places:[],persons:[]}; } });
      const titleRef = useRef();

      useEffect(()=>{ try{ localStorage.setItem("cal_v5",JSON.stringify(tasks)); }catch{} },[tasks]);
      useEffect(()=>{ try{ localStorage.setItem("cal_hist5",JSON.stringify(history)); }catch{} },[history]);
      useEffect(()=>{ if((sheetMode==="add"||sheetMode==="edit")&&titleRef.current) setTimeout(()=>titleRef.current.focus(),100); },[sheetMode]);

      const theme = THEMES[viewMonth];
      const bgUrl = `https://picsum.photos/seed/${theme.seed}/800/1200`;
      const daysInMonth = new Date(viewYear,viewMonth+1,0).getDate();
      const firstDay = new Date(viewYear,viewMonth,1).getDay();
      const tKey = todayKey();

      const prevMonth=()=>{ if(viewMonth===0){setViewMonth(11);setViewYear(y=>y-1);}else setViewMonth(m=>m-1); };
      const nextMonth=()=>{ if(viewMonth===11){setViewMonth(0);setViewYear(y=>y+1);}else setViewMonth(m=>m+1); };
      const openDay=day=>{ setSelectedDate(toKey(viewYear,viewMonth,day)); setSheetMode("day"); };
      const openAdd=()=>{ setForm(EMPTY_FORM); setEditIdx(null); setSheetMode("add"); };
      const openEdit=idx=>{ const t=tasks[selectedDate][idx]; setForm({place:t.place||"",person:t.person||"",time:t.time||"",title:t.title}); setEditIdx(idx); setSheetMode("edit"); };
      const closeSheet=()=>{ setSheetMode(null); setSelectedDate(null); setEditIdx(null); };
      const backToDay=()=>{ setSheetMode("day"); setEditIdx(null); };

      const saveTask=()=>{
        if(!form.title.trim()) return;
        const place=form.place.trim(), person=form.person.trim();
        const task={title:form.title.trim(),time:form.time,place,person};
        setTasks(prev=>{
          const list=[...(prev[selectedDate]||[])];
          if(sheetMode==="edit") list[editIdx]=task; else list.push(task);
          list.sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99"));
          return {...prev,[selectedDate]:list};
        });
        setHistory(h=>({
          places:place&&!h.places.includes(place)?[place,...h.places].slice(0,8):h.places,
          persons:person&&!h.persons.includes(person)?[person,...h.persons].slice(0,8):h.persons,
        }));
        backToDay();
      };

      const deleteTask=idx=>{
        setTasks(prev=>{
          const list=[...(prev[selectedDate]||[])];
          list.splice(idx,1);
          const next={...prev};
          if(list.length===0) delete next[selectedDate]; else next[selectedDate]=list;
          return next;
        });
      };

      const fmtDate=()=>{
        if(!selectedDate) return "";
        const [y,m,d]=selectedDate.split("-");
        return new Date(+y,+m-1,+d).toLocaleDateString("en-MY",{weekday:"long",day:"numeric",month:"long"});
      };

      const dayTasks = selectedDate?(tasks[selectedDate]||[]):[];
      const cells=[];
      for(let i=0;i<firstDay;i++) cells.push(null);
      for(let d=1;d<=daysInMonth;d++) cells.push(d);

      const dInp={ width:"100%", boxSizing:"border-box", padding:"12px 14px", borderRadius:"12px", border:"1.5px solid #374151", fontSize:"15px", outline:"none", background:"#1f2937", fontFamily:"inherit", marginBottom:"12px", color:"#f9fafb" };
      const dLbl={ fontSize:"12px", fontWeight:500, color:"#9ca3af", display:"block", marginBottom:"6px" };
      const chip=(label,fn)=>(
        React.createElement("button", { key:label, onClick:fn, style:{padding:"5px 12px",borderRadius:"99px",border:"1px solid #374151",background:"#1f2937",fontSize:"12px",color:"#9ca3af",cursor:"pointer",minHeight:"36px",marginBottom:"4px"} }, label)
      );
      const darkSheet={ position:"fixed",bottom:0,left:0,right:0,background:"#111827",borderRadius:"24px 24px 0 0",padding:"20px 16px 44px",boxShadow:"0 -8px 40px rgba(0,0,0,0.8)",maxHeight:"88vh",overflowY:"auto",zIndex:400 };

      return (
        <div style={{ minHeight:"100vh", fontFamily:"'Inter',system-ui,sans-serif" }}>

          {/* Background */}
          <div style={{ position:"fixed", inset:0, zIndex:0 }}>
            <img src={bgUrl} alt="" style={{ width:"100%", height:"100%", objectFit:"cover", display:"block" }} />
            <div style={{ position:"absolute", inset:0, background:"rgba(0,0,0,0.58)" }} />
          </div>

          <div style={{ position:"relative", zIndex:2 }}>

            {/* Header */}
            <div style={{ padding:"52px 16px 12px", position:"sticky", top:0, zIndex:10, backdropFilter:"blur(20px)", background:"rgba(0,0,0,0.42)", borderBottom:"1px solid rgba(255,255,255,0.07)" }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"12px" }}>
                <div>
                  <div style={{ display:"flex", alignItems:"center", gap:"8px" }}>
                    <span style={{ fontSize:"20px" }}>{theme.emoji}</span>
                    <h1 style={{ color:"#fff", fontSize:"22px", fontWeight:700, margin:0 }}>{MONTHS[viewMonth]} {viewYear}</h1>
                  </div>
                  <p style={{ color:theme.accent, fontSize:"12px", margin:"2px 0 0", fontWeight:600, letterSpacing:"0.5px", textTransform:"uppercase" }}>{theme.name}</p>
                </div>
                <div style={{ display:"flex", gap:"6px" }}>
                  <button onClick={prevMonth} style={{ width:"36px",height:"36px",borderRadius:"99px",border:"1px solid rgba(255,255,255,0.2)",background:"rgba(255,255,255,0.1)",color:"#fff",fontSize:"18px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center" }}>‹</button>
                  <button onClick={nextMonth} style={{ width:"36px",height:"36px",borderRadius:"99px",border:"1px solid rgba(255,255,255,0.2)",background:"rgba(255,255,255,0.1)",color:"#fff",fontSize:"18px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center" }}>›</button>
                </div>
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:"3px" }}>
                {DAYS.map(d=> React.createElement("div", { key:d, style:{ textAlign:"center", color:"rgba(255,255,255,0.45)", fontSize:"11px", fontWeight:600, padding:"3px 0" } }, d))}
              </div>
            </div>

            {/* Calendar grid */}
            <div style={{ padding:"6px 10px 120px" }}>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:"4px" }}>
                {cells.map((day,i)=>{
                  if(!day) return React.createElement("div", { key:`e-${i}`, style:{ aspectRatio:"1" } });
                  const key=toKey(viewYear,viewMonth,day);
                  const isToday=key===tKey;
                  const isSelected=key===selectedDate&&sheetMode==="day";
                  const list=tasks[key]||[];
                  const hasTasks=list.length>0;

                  return React.createElement("button", {
                    key, onClick:()=>openDay(day),
                    style:{
                      aspectRatio:"1", width:"100%",
                      background:isSelected?theme.accent:"rgba(0,0,0,0.42)",
                      border:isToday&&!isSelected?`2px solid ${theme.accent}`:"2px solid rgba(255,255,255,0.07)",
                      borderRadius:"10px", cursor:"pointer",
                      display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"flex-start",
                      padding:"5px 2px 3px", overflow:"hidden",
                      backdropFilter:"blur(8px)", transition:"all 0.15s",
                    }
                  },
                    React.createElement("span", { style:{ fontSize:"13px", fontWeight:isToday||isSelected?700:400, color:"#fff", lineHeight:1, marginBottom:"2px" } }, day),
                    hasTasks && React.createElement(React.Fragment, null,
                      React.createElement("div", { style:{ display:"flex", gap:"2px", justifyContent:"center", marginBottom:"2px" } },
                        list.slice(0,3).map((_,ti)=> React.createElement("div", { key:ti, style:{ width:"3px",height:"3px",borderRadius:"99px",background:isSelected?"rgba(0,0,0,0.4)":theme.accent } }))
                      ),
                      React.createElement("div", { style:{ fontSize:"7.5px", color:"rgba(255,255,255,0.72)", textAlign:"center", lineHeight:1.25, padding:"0 2px", overflow:"hidden", display:"-webkit-box", WebkitLineClamp:2, WebkitBoxOrient:"vertical", wordBreak:"break-all" } }, list[0].title)
                    )
                  );
                })}
              </div>
            </div>
          </div>

          {/* Backdrop */}
          {sheetMode && React.createElement("div", { onClick:closeSheet, style:{ position:"fixed",inset:0,background:"rgba(0,0,0,0.65)",zIndex:200 } })}

          {/* Day sheet */}
          {sheetMode==="day" && (
            <div style={{ ...darkSheet, zIndex:300 }}>
              <div style={{ width:"40px",height:"4px",background:"#374151",borderRadius:"99px",margin:"0 auto 16px" }} />
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:"16px" }}>
                <div>
                  <h3 style={{ margin:0, fontSize:"17px", fontWeight:700, color:"#f9fafb" }}>{fmtDate()}</h3>
                  <p style={{ margin:"2px 0 0", fontSize:"13px", color:"#6b7280" }}>{dayTasks.length} task{dayTasks.length!==1?"s":""}</p>
                </div>
                <button onClick={openAdd} style={{ background:theme.accent,border:"none",borderRadius:"12px",padding:"10px 18px",color:"#111",fontSize:"14px",fontWeight:700,cursor:"pointer",flexShrink:0 }}>+ Add</button>
              </div>
              {dayTasks.length===0 ? (
                <div style={{ textAlign:"center", padding:"2.5rem 1rem", color:"#4b5563", fontSize:"14px" }}>
                  <div style={{ fontSize:"40px", marginBottom:"10px" }}>{theme.emoji}</div>
                  No tasks — tap + Add to get started
                </div>
              ) : dayTasks.map((task,idx)=>(
                <div key={idx} style={{ background:"#1f2937",borderRadius:"14px",padding:"13px 14px",marginBottom:"8px",display:"flex",gap:"10px",alignItems:"flex-start",borderLeft:`4px solid ${theme.accent}` }}>
                  <div style={{ flex:1, minWidth:0 }}>
                    <p style={{ margin:"0 0 5px", fontSize:"15px", fontWeight:500, color:"#f9fafb", whiteSpace:"pre-wrap", wordBreak:"break-word" }}>{task.title}</p>
                    <div style={{ display:"flex", flexWrap:"wrap", gap:"3px 12px" }}>
                      {task.time && React.createElement("span", { style:{ fontSize:"12px", color:"#9ca3af" } }, task.time)}
                      {task.place && React.createElement("span", { style:{ fontSize:"12px", color:"#9ca3af" } }, task.place)}
                      {task.person && React.createElement("span", { style:{ fontSize:"12px", color:"#9ca3af" } }, task.person)}
                    </div>
                  </div>
                  <div style={{ display:"flex", gap:"6px", flexShrink:0 }}>
                    <button onClick={()=>openEdit(idx)} style={{ background:"#374151",border:"none",borderRadius:"8px",padding:"6px 10px",color:"#f9fafb",fontSize:"12px",fontWeight:600,cursor:"pointer",minHeight:"36px" }}>Edit</button>
                    <button onClick={()=>deleteTask(idx)} style={{ background:"#450a0a",border:"none",borderRadius:"8px",padding:"6px 10px",color:"#fca5a5",fontSize:"12px",fontWeight:600,cursor:"pointer",minHeight:"36px" }}>Del</button>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Add / Edit sheet */}
          {(sheetMode==="add"||sheetMode==="edit") && (
            <div style={darkSheet}>
              <div style={{ width:"40px",height:"4px",background:"#374151",borderRadius:"99px",margin:"0 auto 16px" }} />
              <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"20px" }}>
                <button onClick={backToDay} style={{ background:"none",border:"none",color:theme.accent,fontSize:"22px",cursor:"pointer",padding:"0 4px",lineHeight:1 }}>‹</button>
                <h3 style={{ margin:0, fontSize:"18px", fontWeight:700, color:"#f9fafb" }}>{sheetMode==="edit"?"Edit Task":"New Task"}</h3>
              </div>

              <label style={dLbl}>Place</label>
              <input type="text" value={form.place} onChange={e=>setForm(f=>({...f,place:e.target.value}))} list="pl-list" style={dInp} />
              <datalist id="pl-list">{history.places.map(p=> React.createElement("option", { key:p, value:p }))}</datalist>
              {history.places.length>0&&!form.place&&(
                <div style={{ display:"flex",gap:"6px",flexWrap:"wrap",marginBottom:"12px" }}>
                  {history.places.slice(0,4).map(p=>chip(p,()=>setForm(f=>({...f,place:p}))))}
                </div>
              )}

              <label style={dLbl}>Person</label>
              <input type="text" value={form.person} onChange={e=>setForm(f=>({...f,person:e.target.value}))} list="pe-list" style={dInp} />
              <datalist id="pe-list">{history.persons.map(p=> React.createElement("option", { key:p, value:p }))}</datalist>
              {history.persons.length>0&&!form.person&&(
                <div style={{ display:"flex",gap:"6px",flexWrap:"wrap",marginBottom:"12px" }}>
                  {history.persons.slice(0,4).map(p=>chip(p,()=>setForm(f=>({...f,person:p}))))}
                </div>
              )}

              <label style={dLbl}>Time</label>
              <input type="time" value={form.time} onChange={e=>setForm(f=>({...f,time:e.target.value}))} style={dInp} />

              <label style={dLbl}>Task</label>
              <textarea ref={titleRef} value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} rows={3}
                style={{ ...dInp, resize:"vertical", marginBottom:"20px" }} />

              <button onClick={saveTask} disabled={!form.title.trim()} style={{
                width:"100%", padding:"15px", borderRadius:"14px", border:"none",
                background:form.title.trim()?theme.accent:"#374151",
                color:form.title.trim()?"#111":"#6b7280",
                fontSize:"16px", fontWeight:700,
                cursor:form.title.trim()?"pointer":"default",
                boxShadow:form.title.trim()?"0 4px 20px rgba(0,0,0,0.5)":"none",
                minHeight:"52px",
              }}>{sheetMode==="edit"?"Save Changes":"Add Task"}</button>
            </div>
          )}

          {/* FAB */}
          {!sheetMode && (
            <button onClick={()=>{ setSelectedDate(toKey(now.getFullYear(),now.getMonth(),now.getDate())); setSheetMode("day"); }} style={{
              position:"fixed", bottom:"28px", right:"20px", width:"60px", height:"60px", borderRadius:"99px", border:"none",
              background:theme.accent, color:"#111", fontSize:"30px",
              boxShadow:"0 6px 24px rgba(0,0,0,0.5)", cursor:"pointer",
              display:"flex", alignItems:"center", justifyContent:"center", zIndex:10,
            }}>+</button>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
